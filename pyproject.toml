[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-repository-auditor"
version = "1.0.0"
description = "Evidence-grounded, LLM-directed, read-only GitHub repository auditing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
devops-audit = "agent:main"

[tool.setuptools]
packages = ["auditor"]
py-modules = ["agent", "tools"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".tools", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S"]
ignore = ["S101", "S603", "S607"]
